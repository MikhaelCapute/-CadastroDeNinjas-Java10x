spring.application.name=CadastroDeNinjas

#Configurando Banco de dados AULA Fiasco Java10x --- No SQL há alguns problemas com espaços, então tem que ser tudo junto assim mesmo:
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

#Configurações JPA --- configurando o Hibernate(ainda nao sei o que é mas vou aprender)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.console.enabled=true

# caso de tudo errado, apague tudo e deixe apenas isso
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

